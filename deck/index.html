<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>놀일 발표자료 선택</title>
<style>
  :root{
    --cream:#F7F3E8;
    --ink:#1E2B22;
    --teal:#015E5C;
    --yellow:#F2DF6A;
    --ember:#D0573B;
    --mint:#8FC7B3;
    --line:rgba(255,255,255,.16);
    --font:"Pretendard Variable",Pretendard,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;font-family:var(--font);background:#0a0d0b;color:var(--cream);-webkit-font-smoothing:antialiased}
  body{
    background:
      radial-gradient(circle at 18% 12%,rgba(143,199,179,.22),transparent 34%),
      radial-gradient(circle at 82% 0,rgba(242,223,106,.14),transparent 28%),
      linear-gradient(145deg,#09110d 0%,#102016 50%,#07100d 100%);
  }
  a{color:inherit;text-decoration:none}
  button,input{font:inherit}
  .shell{min-height:100vh;padding:34px clamp(18px,4vw,56px) 48px}
  .top{display:flex;align-items:center;justify-content:space-between;gap:20px;margin:0 auto 42px;max-width:1180px}
  .brand{font-size:15px;font-weight:900;letter-spacing:.18em;color:#fff}
  .home{font-size:13px;font-weight:850;color:rgba(247,243,232,.72);border:1px solid var(--line);border-radius:999px;padding:10px 14px;background:rgba(255,255,255,.04)}
  .hero{max-width:1180px;margin:0 auto 28px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:24px;align-items:end}
  .k{font-size:12px;font-weight:900;letter-spacing:.22em;color:var(--mint);margin-bottom:14px}
  h1{margin:0;font-size:clamp(36px,6vw,74px);line-height:1.05;letter-spacing:0;font-weight:900}
  .hero p{max-width:720px;margin:18px 0 0;color:#d8c9a4;font-size:clamp(16px,2vw,22px);line-height:1.65;font-weight:650}
  .mode-link{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 18px;border-radius:999px;background:var(--yellow);color:#143b34;font-weight:900;white-space:nowrap}
  .gate{max-width:500px;margin:12vh auto 0;border:1px solid var(--line);border-radius:20px;background:rgba(255,255,255,.07);padding:30px;box-shadow:0 28px 90px rgba(0,0,0,.38)}
  .gate h1{font-size:42px}
  .gate p{margin:14px 0 0;color:#d8c9a4;line-height:1.7;font-weight:650}
  .gate-row{display:flex;gap:10px;margin-top:24px}
  .gate input{min-width:0;flex:1;height:54px;border:1px solid rgba(255,255,255,.22);border-radius:13px;background:rgba(0,0,0,.28);color:#fff;padding:0 15px;font-weight:800}
  .gate button{height:54px;border:0;border-radius:999px;background:var(--yellow);color:#143b34;padding:0 20px;font-weight:900;cursor:pointer}
  .gate-error{min-height:22px;margin-top:12px;color:#ff8d76;font-size:13px;font-weight:800}
  .library{display:none;max-width:1180px;margin:0 auto}
  body.unlocked .library{display:block}
  body.unlocked .gate{display:none}
  .toolbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin:28px 0 18px}
  .toolbar strong{font-size:14px;color:#d8c9a4}
  .toolbar button{border:1px solid var(--line);border-radius:999px;background:rgba(255,255,255,.04);color:rgba(247,243,232,.76);padding:10px 13px;font-size:13px;font-weight:850;cursor:pointer}
  .grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
  .card{min-height:184px;display:flex;flex-direction:column;justify-content:space-between;border:1px solid rgba(255,255,255,.15);border-radius:18px;background:rgba(255,255,255,.065);padding:20px;transition:transform .16s ease,border-color .16s ease,background .16s ease}
  .card:hover,.card:focus-visible{transform:translateY(-3px);border-color:rgba(242,223,106,.62);background:rgba(255,255,255,.095);outline:0}
  .tag{display:inline-flex;align-self:flex-start;border:1px solid rgba(143,199,179,.38);border-radius:999px;padding:6px 9px;color:#b9e1d2;font-size:11px;font-weight:900;letter-spacing:.08em}
  .card h2{margin:18px 0 10px;font-size:23px;line-height:1.28;font-weight:900;color:#fff}
  .card p{margin:0;color:#d8c9a4;font-size:14px;line-height:1.55;font-weight:650}
  .open{margin-top:22px;color:var(--yellow);font-size:14px;font-weight:900}
  @media(max-width:900px){.hero{grid-template-columns:1fr}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
  @media(max-width:620px){.shell{padding:24px 18px 40px}.top{margin-bottom:30px}.grid{grid-template-columns:1fr}.gate{margin-top:7vh;padding:24px}.gate-row{flex-direction:column}.gate button{width:100%}.hero p{font-size:16px}}
</style>
</head>
<body>
<main class="shell">
  <div class="top">
    <a class="brand" href="../">PLAY WORK GROW</a>
    <a class="home" href="../">홈페이지</a>
  </div>

  <section class="gate" aria-labelledby="gateTitle">
    <div class="k">PRIVATE NOLIL DECKS</div>
    <h1 id="gateTitle">발표자료</h1>
    <p>농장 현장 발표와 이동 중 공유를 위한 비공개 자료입니다.</p>
    <form class="gate-row" id="gateForm">
      <input id="deckPassword" type="password" autocomplete="current-password" placeholder="비밀번호">
      <button type="submit">열기</button>
    </form>
    <div class="gate-error" id="gateError"></div>
  </section>

  <section class="library" aria-labelledby="libraryTitle">
    <div class="hero">
      <div>
        <div class="k">SELECT A PRESENTATION</div>
        <h1 id="libraryTitle">어떤 발표자료를<br>열까요?</h1>
        <p>전자칠판에서는 기본적으로 발표용 장표를 열고, 대상에 따라 동창회·단체·기업·강연 버전을 선택하세요.</p>
      </div>
      <a class="mode-link" href="files/story-recruit.html?mode=board">대표 발표 바로 열기</a>
    </div>
    <div class="toolbar">
      <strong id="deckCount">발표자료</strong>
      <button type="button" id="logout">잠그기</button>
    </div>
    <div class="grid" id="deckGrid"></div>
  </section>
</main>
<script src="decks.js?v=65ac444"></script>
<script>
  const passHash='8d82cec64e9049ed16ecbd6dc40e29e31bd3d0c4a2069b0bdf335de70dfa58ff';
  const key='nolilDeckUnlocked';
  const form=document.getElementById('gateForm');
  const password=document.getElementById('deckPassword');
  const gateError=document.getElementById('gateError');
  const grid=document.getElementById('deckGrid');
  const count=document.getElementById('deckCount');
  async function digest(text){const data=new TextEncoder().encode(text);const hash=await crypto.subtle.digest('SHA-256',data);return [...new Uint8Array(hash)].map(v=>v.toString(16).padStart(2,'0')).join('');}
  function unlock(){document.body.classList.add('unlocked');sessionStorage.setItem(key,'1');}
  function lock(){document.body.classList.remove('unlocked');sessionStorage.removeItem(key);password.focus();}
  function esc(value){return String(value).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));}
  function renderDecks(){
    const decks=Array.isArray(window.NOLIL_DECKS)?window.NOLIL_DECKS:[];
    count.textContent=`발표자료 ${decks.length}개`;
    grid.innerHTML=decks.map(deck=>`<a class="card" href="${esc(deck.href)}"><span class="tag">${esc(deck.tag)}</span><div><h2>${esc(deck.title)}</h2><p>${esc(deck.desc)}</p></div><span class="open">열기</span></a>`).join('');
  }
  if(sessionStorage.getItem(key)==='1')unlock();
  renderDecks();
  form.addEventListener('submit',async e=>{e.preventDefault();gateError.textContent='';if(await digest(password.value)===passHash){unlock();password.value='';return;}gateError.textContent='비밀번호가 맞지 않습니다.';password.select();});
  document.getElementById('logout').addEventListener('click',lock);
</script>
</body>
</html>
