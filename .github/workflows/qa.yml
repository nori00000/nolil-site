name: Nolil QA

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  browser-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:contract
        env:
          PW_CHANNEL: chromium
      - run: npm run test:a11y
        env:
          PW_CHANNEL: chromium
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-contract-report
          path: |
            playwright-report/
            test-results/
          retention-days: 5

  lighthouse-mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: python3 -m http.server 4173 > /tmp/nolil-http.log 2>&1 &
      - run: npx --yes lighthouse@13.4.1 http://127.0.0.1:4173/index.html --quiet --chrome-flags="--headless --no-sandbox" --output=json --output-path=./lighthouse-report.json --only-categories=performance,accessibility,best-practices,seo
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: lighthouse-mobile-report
          path: lighthouse-report.json
          retention-days: 5
