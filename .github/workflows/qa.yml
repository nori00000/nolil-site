name: Nolil QA

on:
  pull_request:
  push:
    branches: [main]
  # Weekly run: checks that the design audit itself still works (actions,
  # runner and dependency changes), not that the repository changed.
  schedule:
    - cron: "17 0 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-contract:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:contract
        env:
          PW_CHANNEL: chromium
      - run: npm run test:a11y
        env:
          PW_CHANNEL: chromium
      - run: npm run test:design-contract
        env:
          PW_CHANNEL: chromium
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-contract-report
          path: |
            playwright-report/
            test-results/
          retention-days: 5

  design-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          # --against needs the base branch's baseline file.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:design
      - if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          npm run design:lint
          npm run design:audit
      - if: github.event_name == 'pull_request'
        run: |
          npm run design:lint -- --against "origin/$BASE_REF"
          npm run design:audit -- --against "origin/$BASE_REF"
        env:
          BASE_REF: ${{ github.base_ref }}
      - if: github.event_name == 'push'
        run: |
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            echo "design --against skipped: push has no previous commit (event.before=$BEFORE)"
            npm run design:lint
            npm run design:audit
          else
            npm run design:lint -- --against "$BEFORE"
            npm run design:audit -- --against "$BEFORE"
          fi
        env:
          BEFORE: ${{ github.event.before }}

  lighthouse-mobile:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: python3 -m http.server 4173 > /tmp/nolil-http.log 2>&1 &
      - run: npx --yes lighthouse@13.4.1 http://127.0.0.1:4173/index.html --quiet --chrome-flags="--headless --no-sandbox" --output=json --output-path=./lighthouse-report.json --only-categories=performance,accessibility,best-practices,seo
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: lighthouse-mobile-report
          path: lighthouse-report.json
          retention-days: 5
